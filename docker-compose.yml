version: '3.4'

services:
  questlog-api:
    image: questlog-api
    build:
      context: .
      dockerfile: QuestLog.Api/Dockerfile
    ports:
      - "5000:8080"  
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=QuestLogDb;Username=postgres;Password=221106
    depends_on:
      - postgres

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 221106
      POSTGRES_DB: QuestLogDb
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: